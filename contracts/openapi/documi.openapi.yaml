openapi: 3.1.0
info:
  title: Documi API
  version: 0.1.0
  description: Bootstrap contract for the Documi server API.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /ready:
    get:
      operationId: getReadiness
      tags: [System]
      responses:
        "200":
          description: Process can serve requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      tags: [System]
      responses:
        "200":
          description: Safe deployment information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
  /api/v1/auth/config:
    get:
      operationId: getPublicAuthConfig
      tags: [Authentication]
      responses:
        "200": { description: Non-secret client authentication configuration. }
  /api/v1/me:
    get:
      operationId: getCurrentSubject
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The validated current subject. }
        "401": { description: A valid bearer token is required. }
  /api/v1/document-editors:
    get:
      operationId: listDocumentEditors
      tags: [Document Editors]
      responses:
        "200":
          description: Normalized provider availability without provider secrets.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/EditorProviderStatus" }
  /api/v1/document-editors/{provider}/status:
    get:
      operationId: getDocumentEditorStatus
      tags: [Document Editors]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: "#/components/schemas/EditorProviderId" }
      responses:
        "200":
          description: Normalized provider status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorProviderStatus" }
        "404": { description: Provider ID is not registered. }
  /api/v1/workspaces:
    get:
      operationId: listAuthorizedWorkspaces
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workspaces constrained by the current user's grants.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces: { type: array, items: { $ref: "#/components/schemas/Workspace" } }
  /api/v1/workspaces/{workspaceId}/documents:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDocuments
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: SQL permission-constrained document list.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      operationId: createManagedDocument
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/CreateNativeDocument" }
                - { $ref: "#/components/schemas/CreateOfficeDocument" }
      responses:
        "201": { description: Managed document and initial immutable version created from native content or a checksum-pinned Office template. }
        "404": { description: Workspace is missing or current permission denies creation. }
  /api/v1/workspaces/{workspaceId}/document-uploads:
    post:
      operationId: uploadOfficeDocument
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
                folderId: { type: string, format: uuid }
      responses:
        "201": { description: Validated Office/OpenDocument upload and initial immutable version created. }
        "400": { description: Filename, MIME type, archive structure, or size is invalid. }
        "404": { description: Workspace is missing or current permission denies creation. }
  /api/v1/documents/{id}:
    get:
      operationId: getDocument
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Authorized document metadata and native content. }
        "404": { description: Document is missing or current permission denies access. }
  /api/v1/documents/{id}/content:
    get:
      operationId: getDocumentContent
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Hash- and size-verified content for a user with read access. }
        "404": { description: Document is missing or current permission denies access. }
  /api/v1/documents/{id}/download:
    get:
      operationId: downloadDocument
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Hash-verified attachment for a user with download access. }
        "404": { description: Document is missing or current permission denies download. }
  /api/v1/documents/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDocumentVersions
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authorized immutable version history. }
    post:
      operationId: saveNativeDocumentVersion
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveNativeDocument" }
      responses:
        "201": { description: New immutable version created. }
        "409": { description: Base version is stale. }
        "423": { description: An active WOPI edit lock prevents a native save. }
  /api/v1/documents/{id}/editor-session:
    post:
      operationId: createDocumentEditorSession
      tags: [Document Editors]
      description: Creates a persisted authorized provider session using a server-generated action and WOPI URL.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerId, requestedEdit]
              properties:
                providerId: { $ref: "#/components/schemas/EditorProviderId" }
                requestedEdit: { type: boolean }
      responses:
        "201":
          description: Authorized editor session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorSession" }
        "404": { description: Document is missing or current permission denies access. }
        "502": { description: Configured provider session creation failed. }
        "503": { description: Provider or required document service is unavailable. }
  /api/v1/workspaces/{workspaceId}/folders:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFolders
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Authorized workspace folder hierarchy. }
    post:
      operationId: createFolder
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderMutation" }
      responses:
        "201": { description: Folder created and audited. }
  /api/v1/folders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateFolder
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Folder renamed or moved after cycle and workspace validation. }
    delete:
      operationId: deleteFolder
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Empty folder deleted and audited. }
        "409": { description: Folder is not empty. }
  /api/v1/organizations/{organizationId}/groups:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGroups
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Organization groups. }
    post:
      operationId: createGroup
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 255 } }
      responses:
        "201": { description: Group created and audited. }
  /api/v1/groups/{id}:
    patch:
      operationId: updateGroup
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 255 } }
      responses:
        "200": { description: Group renamed and audited. }
    delete:
      operationId: deleteGroup
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Group, memberships, and grants deleted; mutation audited. }
  /api/v1/groups/{groupId}/members:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGroupMembers
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Group members. }
    post:
      operationId: addGroupMember
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties: { userId: { type: string, format: uuid } }
      responses:
        "204": { description: Membership exists and any new mutation was audited. }
  /api/v1/groups/{groupId}/members/{userId}:
    delete:
      operationId: removeGroupMember
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Membership removed and audited. }
  /api/v1/organizations/{organizationId}/grants:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAuthorizationGrants
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Grants visible to a permission manager. }
    post:
      operationId: createAuthorizationGrant
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGrant" }
      responses:
        "201": { description: Additive grant created and audited. }
        "409": { description: Duplicate or last-owner invariant conflict. }
  /api/v1/grants/{id}:
    delete:
      operationId: deleteAuthorizationGrant
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Grant removed and audited. }
        "409": { description: Removing the last organization owner is forbidden. }
  /api/v1/organizations/{organizationId}/audit:
    get:
      operationId: queryAuditEvents
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: workspaceId, in: query, schema: { type: string, format: uuid } }
        - { name: eventType, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Cursor-paginated append-only audit events. }
  /api/v1/organizations/{organizationId}/editor-policies:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listEditorPolicies
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Centralized organization editor preferences. }
    put:
      operationId: setEditorPolicy
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [family, providerId]
              properties:
                family: { type: string, enum: [native, text, spreadsheet, presentation, pdf] }
                providerId: { $ref: "#/components/schemas/EditorProviderId" }
      responses:
        "200": { description: Valid provider-family preference stored and audited. }
  /api/v1/access/effective:
    get:
      operationId: diagnoseEffectiveAccess
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subjectId, in: query, schema: { type: string, format: uuid } }
        - { name: scopeType, in: query, required: true, schema: { type: string, enum: [organization, workspace, folder, document] } }
        - { name: scopeId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Union of direct, group, and inherited capabilities. }
  /api/v1/wopi/files/{id}:
    get:
      operationId: wopiCheckFileInfo
      tags: [WOPI]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: access_token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Permission-filtered WOPI file information. }
        "401": { description: Missing, invalid, expired, or mismatched editor token. }
        "404": { description: Document is missing or current permission denies access. }
    post:
      operationId: wopiFileOperation
      tags: [WOPI]
      description: Dispatches WOPI lock operations from X-WOPI headers.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: access_token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Lock operation completed. }
        "401": { description: Invalid editor token. }
        "404": { description: Document is missing or current permission denies access. }
        "409": { description: Lock mismatch; X-WOPI-Lock contains the current lock. }
  /api/v1/wopi/files/{id}/contents:
    get:
      operationId: wopiGetFile
      tags: [WOPI]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: access_token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Authorized document version bytes. }
        "401": { description: Invalid editor token. }
        "404": { description: Document is missing or current permission denies access. }
    post:
      operationId: wopiPutFile
      tags: [WOPI]
      description: Routes validated content to the Documents service to create a new immutable version.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: access_token, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: A new document version was created. }
        "401": { description: Invalid editor token. }
        "404": { description: Document is missing or current edit permission is absent. }
        "409": { description: Document version conflict. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    SystemInfo:
      type: object
      additionalProperties: false
      required: [name, version, environment, airGapped]
      properties:
        name: { type: string, const: Documi }
        version: { type: string }
        environment: { type: string }
        airGapped: { type: boolean }
    Workspace:
      type: object
      required: [id, organizationId, name, mode]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        mode: { type: string, const: server }
    Document:
      type: object
      required: [id, workspaceId, title, family, mimeType, editorProvider, storageMode, currentVersionId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        title: { type: string }
        family: { type: string }
        mimeType: { type: string }
        editorProvider: { $ref: "#/components/schemas/EditorProviderId" }
        storageMode: { type: string, enum: [managed, external] }
        currentVersionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        content: {}
    CreateNativeDocument:
      type: object
      additionalProperties: false
      required: [title, family, content]
      properties:
        title: { type: string, maxLength: 255 }
        folderId: { type: string, format: uuid }
        family: { type: string, const: native }
        content: {}
    CreateOfficeDocument:
      type: object
      additionalProperties: false
      required: [title, family]
      properties:
        title: { type: string, maxLength: 255 }
        folderId: { type: string, format: uuid }
        family: { type: string, enum: [text, spreadsheet, presentation] }
    FolderMutation:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        parentId: { type: [string, "null"], format: uuid }
    CreateGrant:
      type: object
      additionalProperties: false
      required: [principalType, principalId, scopeType, scopeId, role]
      properties:
        principalType: { type: string, enum: [user, group] }
        principalId: { type: string, format: uuid }
        scopeType: { type: string, enum: [organization, workspace, folder, document] }
        scopeId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, manager, editor, contributor, viewer, guest] }
    SaveNativeDocument:
      type: object
      additionalProperties: false
      required: [baseVersionId, content]
      properties:
        baseVersionId: { type: string, format: uuid }
        content: {}
    EditorProviderId:
      type: string
      enum: [native, collabora, onlyoffice, libreoffice-desktop, google-docs, google-sheets, google-slides]
    EditorProviderStatus:
      type: object
      additionalProperties: false
      required: [id, available, capabilities, families]
      properties:
        id: { $ref: "#/components/schemas/EditorProviderId" }
        available: { type: boolean }
        reason: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [create, edit, view, convert, export, collaborative, browser, desktop, offline, external, external-process]
        families:
          type: array
          items:
            type: string
            enum: [native, text, spreadsheet, presentation, pdf]
    EditorSession:
      type: object
      additionalProperties: false
      required: [providerId, mode, readOnly]
      properties:
        providerId: { $ref: "#/components/schemas/EditorProviderId" }
        mode: { type: string }
        url: { type: string, format: uri }
        accessToken: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
        accessTokenTtl:
          type: integer
          description: Editor token lifetime in milliseconds.
        readOnly: { type: boolean }
