openapi: 3.1.0
info:
  title: Documi API
  version: 0.1.0
  description: Bootstrap contract for the Documi server API.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /ready:
    get:
      operationId: getReadiness
      tags: [System]
      responses:
        "200":
          description: Process can serve requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      tags: [System]
      responses:
        "200":
          description: Safe deployment information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
components:
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    SystemInfo:
      type: object
      additionalProperties: false
      required: [name, version, environment, airGapped]
      properties:
        name: { type: string, const: Documi }
        version: { type: string }
        environment: { type: string }
        airGapped: { type: boolean }
