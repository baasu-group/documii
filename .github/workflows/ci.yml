name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.7.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: documi
          POSTGRES_PASSWORD: documi_test
          POSTGRES_DB: documi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U documi -d documi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.x", cache-dependency-path: services/core/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run ./cmd/migrate --dir ../../database/migrations
        env:
          DOCUMI_DATABASE_URL: postgres://documi:documi_test@localhost:5432/documi_test?sslmode=disable
      - run: go test ./...
        env:
          DOCUMI_TEST_DATABASE_URL: postgres://documi:documi_test@localhost:5432/documi_test?sslmode=disable
      - run: go test -race ./...
        env:
          DOCUMI_TEST_DATABASE_URL: postgres://documi:documi_test@localhost:5432/documi_test?sslmode=disable
      - run: go build ./...

  desktop-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        working-directory: .
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { version: "0.12.5", enable-cache: true }
      - run: uv sync --frozen
        working-directory: services/ai
      - run: uv run ruff format --check .
        working-directory: services/ai
      - run: uv run ruff check .
        working-directory: services/ai
      - run: uv run pytest
        working-directory: services/ai
      - run: uv run document-worker --once && uv run ai-worker --once
        working-directory: services/ai
