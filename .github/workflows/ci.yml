name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.7.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x", cache-dependency-path: services/core/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { version: "0.12.5", enable-cache: true }
      - run: uv sync --frozen
        working-directory: services/ai
      - run: uv run ruff format --check .
        working-directory: services/ai
      - run: uv run ruff check .
        working-directory: services/ai
      - run: uv run pytest
        working-directory: services/ai
      - run: uv run document-worker --once && uv run ai-worker --once
        working-directory: services/ai
