[package]
name = "documi-desktop"
version = "0.1.0"
description = "Documi desktop platform shell"
authors = ["Documi contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "documi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
